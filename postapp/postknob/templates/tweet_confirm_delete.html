{% extends "layout.html" %}
{% block title %}Delete Post — PostKnob{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
  <div class="card p-6 text-center animate-fade-in border-red-800/40">
    <div class="text-5xl mb-4">🗑️</div>
    <h1 class="text-xl font-bold text-white mb-2">Delete this post?</h1>
    <p class="text-zinc-400 text-sm mb-6 italic">"{{ tweet.text|truncatechars:100 }}"</p>
    <div class="flex justify-center gap-3">
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold px-6 py-2.5 rounded-xl transition">Yes, Delete</button>
      </form>
      <a href="{% url 'postknob:tweet_list' %}" class="btn-secondary px-6 py-2.5">Cancel</a>
    </div>
  </div>
</div>
{% endblock %}
