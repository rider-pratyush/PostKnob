[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "migrations", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]
exclude = '''
/(
  \.venv
  | migrations
  | __pycache__
)/
'''

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "postapp.settings.dev"
python_files = "tests/test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["postknob"]
omit = ["*/migrations/*", "*/tests/*", "*/__pycache__/*"]
